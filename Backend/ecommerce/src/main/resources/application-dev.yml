spring:
  application:
    name: ecommerce
  
  # DATABASE (MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # Redis Configuration (ENABLED for local development with Docker)
  # This profile is used for: mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=dev"
  data:
    redis:
      enabled: true  # ✓ ENABLED for local development - connects to Docker redis container
      host: ${REDIS_HOST:localhost}  # Use localhost since Spring Boot runs on host machine
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}

  # Security
  security:
    user:
      name: user
      password: password
  
  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # CORS
  webflux:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allowed-methods: GET,POST,PUT,DELETE

# Server
server:
  port: 8080

# Logging
logging:
  level:
    org.springframework.security: DEBUG

