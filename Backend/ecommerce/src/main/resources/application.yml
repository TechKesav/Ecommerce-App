spring:
  application:
    name: ecommerce
  
  # Default profile is 'dev' (no Redis)
  profiles:
    active: dev
  
  # DATABASE (MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # Redis (Disabled by default)
  redis:
    enabled: false

  # OAuth2 Client Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope: user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/github"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v1/userinfo
            user-name-attribute: sub
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

  # Security
  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}

# Server
server:
  port: ${SERVER_PORT:8080}

# Logging
logging:
  level:
    org.springframework.security: DEBUG

# Application Properties
JWT_SECRET: ${JWT_SECRET:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==}
razorpay:
  keyId: ${RAZORPAY_KEY_ID:rzp_test_cDwJbY6QRF2zVw}
  keySecret: ${RAZORPAY_KEY_SECRET:Ahsnni4WCgxLnEGh4NGjilXY}

# ==========================================
# HOW TO USE THESE PROFILES:
# ==========================================
# 
# 1. DEVELOPMENT (No Redis):
#    mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=dev"
#    OR
#    java -jar app.jar --spring.profiles.active=dev
#
# 2. PRODUCTION (With Redis):
#    java -jar app.jar --spring.profiles.active=prod
#    Environment variables needed:
#    - DB_USERNAME, DB_PASSWORD
#    - REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
#    - JWT_SECRET_KEY
#    - RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET
#    - SECURITY_PASSWORD
#
# ==========================================
