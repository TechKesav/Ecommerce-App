spring:
  application:
    name: ecommerce
  
  # DATABASE (MySQL - Production credentials)
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:ecommerce_db}
    username: ${DB_USER:ecommerce_user}
    password: ${DB_PASSWORD:ecommerce_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate  # ✓ NEVER use 'update' in production
    show-sql: false  # Disable SQL logging in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  # Redis Configuration (DISABLED for production)
  redis:
    enabled: false  # ✓ DISABLED for production - no caching overhead
  
  # Security
  security:
    user:
      name: user
      password: ${SECURITY_PASSWORD}
  
  # File Upload (Limit for production)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # CORS (Production domains only)
  webflux:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com,https://www.yourdomain.com}
      allowed-methods: GET,POST,PUT,DELETE

# Server
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024

# Logging (Minimal in production)
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    com.kesav.ecommerce: INFO

# Application Properties
secretKey: ${JWT_SECRET}
razorpay:
  keyId: ${RAZORPAY_KEY_ID}
  keySecret: ${RAZORPAY_KEY_SECRET}
