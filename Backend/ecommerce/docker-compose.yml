version: '3.8'

services:
  mysql:
    container_name: ecommerce_mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_pass
    volumes:
      - ecommerce_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - ecommerce_net
    restart: unless-stopped

  phpmyadmin:
    container_name: ecommerce_phpmyadmin
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8085:80"
    networks:
      - ecommerce_net
    restart: unless-stopped

  redis:
    container_name: ecommerce_redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - ecommerce_redis_data:/data
    networks:
      - ecommerce_net
    restart: unless-stopped
    command: redis-server --appendonly yes

  redis-commander:
    container_name: ecommerce_redis_ui
    image: ghcr.io/joeferner/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - ecommerce_net
    depends_on:
      - redis
    restart: unless-stopped

networks:
  ecommerce_net:
    driver: bridge

volumes:
  ecommerce_mysql_data:
  ecommerce_redis_data:
